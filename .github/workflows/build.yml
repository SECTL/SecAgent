name: Build desktop applications

on:
  push:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
          - name: linux
            os: ubuntu-latest
          - name: macos
            os: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: secagent-${{ matrix.name }}
          path: release/
          if-no-files-found: error
