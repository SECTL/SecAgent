name: Publish Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: windows
    runs-on: windows-latest
    env:
      SECAGENT_UPDATE_PRIVATE_KEY: ${{ secrets.SECAGENT_UPDATE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Validate tag and package version
        id: version
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $tagVersion = "${{ github.ref_name }}" -replace '^v', ''
          if ($package.version -ne $tagVersion) {
            throw "Git tag version $tagVersion does not match package.json version $($package.version)"
          }
          "version=$tagVersion" >> $env:GITHUB_OUTPUT

      - name: Package Windows application directory
        run: npm run package:windows

      - name: Generate Windows installer file manifest
        run: node scripts/create-installer-manifest.mjs release/win-unpacked release/SecAgent.files.sha256

      - name: Build Inno Setup installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.9
        with:
          path: installer/SecAgent.iss
          install_latest: true
          # One option per line: the action splits the input on newlines only,
          # so a folded single-line value would reach ISCC as ONE argument and
          # /DAppVersion would swallow the rest (it leaked into the compiled
          # version label in alpha.25).
          options: |
            /DAppVersion=${{ steps.version.outputs.version }}
            /DSourceDir=${{ github.workspace }}\release\win-unpacked
            /DOutputDir=${{ github.workspace }}\release\inno
            /DManifestFile=${{ github.workspace }}\release\SecAgent.files.sha256
            /DOutputBaseFilename=SecAgent-Setup-${{ steps.version.outputs.version }}

      - name: Generate installer checksum
        shell: pwsh
        run: |
          $setup = "release\inno\SecAgent-Setup-${{ steps.version.outputs.version }}.exe"
          $defaultSetup = "release\inno\SecAgent-Setup.exe"
          if (-not (Test-Path -LiteralPath $setup) -and (Test-Path -LiteralPath $defaultSetup)) {
            Move-Item -LiteralPath $defaultSetup -Destination $setup
          }
          if (-not (Test-Path -LiteralPath $setup)) { throw "Installer was not generated: $setup" }
          $hash = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $setup)" | Set-Content -LiteralPath "$setup.sha256" -Encoding ascii

      - name: Checkout metadata branch
        if: ${{ env.SECAGENT_UPDATE_PRIVATE_KEY != '' }}
        uses: actions/checkout@v4
        with:
          ref: master
          path: metadata-repo
          fetch-depth: 1

      - name: Generate and publish signed channel metadata
        if: ${{ env.SECAGENT_UPDATE_PRIVATE_KEY != '' }}
        shell: pwsh
        run: |
          node scripts/create-update-metadata.mjs `
            metadata-repo/updates.json `
            "${{ steps.version.outputs.version }}" `
            "${{ github.ref_name }}" `
            "release/inno/SecAgent-Setup-${{ steps.version.outputs.version }}.exe"
          git -C metadata-repo config user.name "github-actions[bot]"
          git -C metadata-repo config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C metadata-repo add updates.json
          git -C metadata-repo diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git -C metadata-repo commit -m "chore: update signed update metadata for ${{ github.ref_name }} [skip ci]"
            git -C metadata-repo push origin HEAD:master
          }

      - name: Report unsigned metadata fallback
        if: ${{ env.SECAGENT_UPDATE_PRIVATE_KEY == '' }}
        run: echo "SECAGENT_UPDATE_PRIVATE_KEY is not configured; clients will use the GitHub Releases API fallback."

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/inno/SecAgent-Setup-${{ steps.version.outputs.version }}.exe
            release/inno/SecAgent-Setup-${{ steps.version.outputs.version }}.exe.sha256
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true

  # Linux and macOS packages are appended to the release created by the
  # Windows job; `needs` keeps the two asset uploads from racing each other.
  release-desktop:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          # Older LTS baseline so the packages stay installable on older
          # glibc distributions.
          - name: linux
            os: ubuntu-22.04
          - name: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build:cli
      - run: npm test
      - run: npm run package

      - name: Generate Linux checksums
        if: matrix.name == 'linux'
        run: |
          cd release
          for file in *.AppImage *.deb *.rpm; do
            [ -e "$file" ] && sha256sum "$file" > "$file.sha256"
          done

      - name: Generate macOS checksums
        if: matrix.name == 'macos'
        run: |
          cd release
          for file in *.dmg; do
            [ -e "$file" ] && shasum -a 256 "$file" > "$file.sha256"
          done

      - name: Publish Linux assets
        if: matrix.name == 'linux'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.sha256
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Publish macOS assets
        if: matrix.name == 'macos'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.sha256
          prerelease: ${{ contains(github.ref_name, '-') }}

  # Runs last so the table can list every asset uploaded by the jobs above.
  release-links:
    needs: [release, release-desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Append proxy download links to the release body
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          PROXY="https://ghproxy.sectl.cn"

          # Collect every asset of this release and build a markdown table of
          # proxied download links (the ghproxy mirror is faster in CN).
          ASSETS="$(gh api "repos/${{ github.repository }}/releases/tags/${TAG}" --jq '.assets[].name' | sort)"
          if [ -z "$ASSETS" ]; then
            echo "no assets found; skipping" >&2
            exit 0
          fi

          python3 - "$TAG" "$BASE" "$PROXY" <<'PYEOF' > section.md
          import sys
          tag, base, proxy = sys.argv[1], sys.argv[2], sys.argv[3]
          names = sorted(line.strip() for line in sys.stdin if line.strip())
          lines = [
              "<!-- ghproxy-links -->",
              "## 下载链接（加速镜像）",
              "",
              "| 附件 | 下载链接 |",
              "| --- | --- |",
          ]
          for name in names:
              safe = name.replace("|", "\\|")
              lines.append(f"| {safe} | {proxy}/{base}/{name} |")
          lines.append("<!-- ghproxy-links -->")
          print("\n".join(lines))
          PYEOF

          BODY="$(gh release view "$TAG" --json body --jq .body)"
          python3 - "$BODY" <<'PYEOF' > newbody.md
          import re, sys
          body, section = sys.argv[1], open("section.md", encoding="utf-8").read().strip()
          marker = "<!-- ghproxy-links -->"
          # Replace an existing section (reruns) or append a new one.
          pattern = re.compile(re.escape(marker) + r".*?" + re.escape(marker), re.DOTALL)
          print(pattern.sub(section, body) if marker in body else f"{body.rstrip()}\n\n{section}")
          PYEOF
          gh release edit "$TAG" --notes-file newbody.md
